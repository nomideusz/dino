<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio Bartek — widget</title>
<!--
  Self-contained, dependency-free radio widget.

  Embed anywhere:
    <iframe src="https://dino.zaur.app/radio-widget.html"
            style="width:340px;height:118px;border:0" title="Radio Bartek"></iframe>

  Reuse for another AzuraCast station via query params:
    ?base=https://your.host&station=your_shortcode&accent=%23ff2e88
  All it needs from the host is the public now-playing API (CORS-open) and the
  stream mount — no build step, no framework.
-->
<style>
  :root {
    --accent: #ff2e88;
    --bg: #0e0e14;
    --ink: #e8e4d8;
    --ink-soft: #8a8678;
    --live: #b6ff3a;
    --mono: "Ioskeley Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: var(--mono);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .rb {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 100%;
    min-height: 0;
    padding: 10px;
    background: var(--bg);
    border: 1px solid color-mix(in srgb, var(--accent), transparent 70%);
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4) inset,
      0 6px 22px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
  }
  .rb::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), #19d3ff 60%, transparent);
    opacity: 0.9;
  }

  .rb-art {
    width: 56px;
    height: 56px;
    flex: 0 0 auto;
    border-radius: 5px;
    object-fit: cover;
    background: #1a1a22;
    border: 1px solid color-mix(in srgb, var(--accent), transparent 55%);
    image-rendering: auto;
  }

  .rb-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .rb-brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 2px;
    flex-wrap: wrap;
  }
  .rb-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft); flex: 0 0 auto;
  }
  .rb.live .rb-dot { background: var(--live); box-shadow: 0 0 6px var(--live); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
  .rb-status { color: var(--ink-soft); }
  .rb.live .rb-status { color: var(--live); }
  .rb-listeners { color: var(--ink-soft); }

  .rb-like {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 42px;
    height: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink-soft);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 0 8px;
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .rb-like:hover {
    color: #ff9ec8;
    border-color: color-mix(in srgb, var(--accent), transparent 55%);
  }
  .rb-like:active { transform: scale(0.94); }
  .rb-like .rb-like-ico { font-size: 12px; line-height: 1; }
  .rb-like.liked,
  .rb-like.requested {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent), transparent 45%);
    background: color-mix(in srgb, var(--accent), transparent 88%);
  }
  .rb-like:disabled { opacity: 0.45; cursor: default; }

  .rb-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }

  .rb-title {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .rb-artist {
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rb-artist:empty { display: none; }

  .rb-bar {
    margin-top: 6px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .rb-fill {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #19d3ff);
    transition: width 0.9s linear;
  }
  .rb-bar.hidden { visibility: hidden; }

  .rb-vol {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .rb-vol-ico {
    width: 12px;
    height: 12px;
    flex: 0 0 auto;
    fill: var(--ink-soft);
    opacity: 0.8;
  }
  .rb-vol input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 auto;
    min-width: 0;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    outline: none;
    cursor: pointer;
  }
  .rb-vol input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink);
    border: 0;
  }
  .rb-vol input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink);
    border: 0;
  }

  .rb-play {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent), transparent 45%);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .rb-play:hover { filter: brightness(1.12); }
  .rb-play:active { transform: scale(0.94); }
  .rb-play svg { width: 18px; height: 18px; fill: #fff; }
  .rb-play .ico-pause { display: none; }
  .rb.playing .rb-play .ico-play { display: none; }
  .rb.playing .rb-play .ico-pause { display: block; }
  .rb.loading .rb-play { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* Compact stripe — parent shell uses a short iframe (mobile) or ?compact=1 */
  html[data-layout="compact"] .rb {
    min-height: 0;
    height: 100%;
    padding: 0 8px;
    gap: 6px;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  html[data-layout="compact"] .rb::before { display: none; }

  html[data-layout="compact"] .rb-art {
    width: 28px;
    height: 28px;
    border-radius: 4px;
  }

  html[data-layout="compact"] .rb-main {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  html[data-layout="compact"] .rb-brand {
    margin: 0;
    flex: 0 0 auto;
    font-size: 8px;
    gap: 4px;
  }
  html[data-layout="compact"] .rb-listeners { display: none; }

  html[data-layout="compact"] .rb-side {
    flex-direction: row;
    gap: 4px;
  }
  html[data-layout="compact"] .rb-like {
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 0;
  }
  html[data-layout="compact"] .rb-like .rb-like-ico { font-size: 12px; }
  html[data-layout="compact"] .rb-like #likes { display: none; }

  html[data-layout="compact"] .rb-track { flex: 1 1 auto; min-width: 0; }
  html[data-layout="compact"] .rb-title {
    font-size: 11px;
    font-weight: 600;
    -webkit-line-clamp: 1;
    white-space: nowrap;
    display: block;
    text-overflow: ellipsis;
  }

  html[data-layout="compact"] .rb-artist,
  html[data-layout="compact"] .rb-bar {
    display: none;
  }

  html[data-layout="compact"] .rb-vol {
    display: flex;
    margin: 0;
    width: 54px;
    flex: 0 0 auto;
    gap: 4px;
  }
  html[data-layout="compact"] .rb-vol-ico { width: 10px; height: 10px; }

  html[data-layout="compact"] .rb-play {
    width: 32px;
    height: 32px;
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent), transparent 55%);
  }
  html[data-layout="compact"] .rb-play svg { width: 14px; height: 14px; }
</style>
</head>
<body>
  <div class="rb" id="rb">
    <img class="rb-art" id="art" alt="" />
    <div class="rb-main">
      <div class="rb-brand">
        <span class="rb-dot"></span>
        <span class="rb-status" id="status">offline</span>
        <span class="rb-listeners" id="listeners"></span>
      </div>
      <div class="rb-track">
        <div class="rb-title" id="title">—</div>
        <div class="rb-artist" id="artist"></div>
      </div>
      <div class="rb-bar" id="bar"><span class="rb-fill" id="fill"></span></div>
      <div class="rb-vol">
        <svg class="rb-vol-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="volume" min="0" max="100" step="1" value="80" aria-label="Volume" />
      </div>
    </div>
    <div class="rb-side">
      <button class="rb-like" id="like" type="button" aria-label="Like this track" title="Like this track" hidden>
        <span class="rb-like-ico" aria-hidden="true">♥</span>
        <span id="likes"></span>
      </button>
      <button class="rb-play" id="play" aria-label="Play / pause" title="Play / pause">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

  <script>
  (function () {
    var q = new URLSearchParams(location.search);
    var BASE = (q.get("base") || "https://radiobartek.com").replace(/\/$/, "");
    var STATION = q.get("station") || "radio_bartek";
    var accent = q.get("accent");
    if (accent) document.documentElement.style.setProperty("--accent", accent);

    // Compact layout is driven by iframe height from the parent shell — not
    // viewport width (desktop embed is only ~300px wide).
    function syncLayout() {
      var compact = q.get("compact") === "1" || window.innerHeight <= 64;
      document.documentElement.dataset.layout = compact ? "compact" : "full";
      // Shell header already shows listeners on desktop embeds.
      if (els.listeners) els.listeners.hidden = window.parent !== window && !compact;
    }

    var rb = document.getElementById("rb");
    var els = {
      art: document.getElementById("art"),
      status: document.getElementById("status"),
      listeners: document.getElementById("listeners"),
      likes: document.getElementById("likes"),
      like: document.getElementById("like"),
      title: document.getElementById("title"),
      artist: document.getElementById("artist"),
      bar: document.getElementById("bar"),
      fill: document.getElementById("fill"),
      play: document.getElementById("play"),
      audio: document.getElementById("audio"),
      volume: document.getElementById("volume"),
    };

    syncLayout();
    window.addEventListener("resize", syncLayout);

    var VOL_KEY = "rb-volume";
    var LIKES_KEY = "rb-likes";
    var storedVol = null;
    try { storedVol = localStorage.getItem(VOL_KEY); } catch (e) { /* private mode */ }
    var vol = storedVol == null ? 80 : Math.max(0, Math.min(100, Number(storedVol) || 0));
    els.volume.value = vol;
    els.audio.volume = vol / 100;
    els.volume.addEventListener("input", function () {
      els.audio.volume = els.volume.value / 100;
      try { localStorage.setItem(VOL_KEY, els.volume.value); } catch (e) { /* ignore */ }
    });

    var streamUrl = BASE + "/listen/" + STATION + "/radio.mp3";
    var elapsed = 0, duration = 0, lastSync = 0;
    var currentSongId = "";

    function readLikes() {
      try {
        var raw = localStorage.getItem(LIKES_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function writeLikes(map) {
      try { localStorage.setItem(LIKES_KEY, JSON.stringify(map)); } catch (e) { /* ignore */ }
    }

    function likeCount(songId) {
      if (!songId) return 0;
      var map = readLikes();
      return Number(map[songId]) || 0;
    }

    function bumpLike(songId) {
      if (!songId) return 0;
      var map = readLikes();
      map[songId] = (Number(map[songId]) || 0) + 1;
      writeLikes(map);
      return map[songId];
    }

    function updateLikeUi(songId, isRequest) {
      var count = likeCount(songId);
      els.likes.textContent = count > 0 ? String(count) : "";
      els.like.hidden = !songId;
      els.like.classList.toggle("requested", !!isRequest);
      els.like.classList.toggle("liked", count > 0);
      els.like.disabled = !songId;
      els.like.title = "Like this track";
    }

    function notifyParent(listeners, likes, isRequest) {
      if (window.parent === window) return;
      window.parent.postMessage({
        type: "dino-radio-stats",
        listeners: listeners,
        likes: likes,
        requested: !!isRequest,
      }, "*");
    }

    async function poll() {
      try {
        var r = await fetch(BASE + "/api/nowplaying/" + STATION, { cache: "no-store" });
        if (!r.ok) throw new Error("http " + r.status);
        var d = await r.json();
        var np = d.now_playing || {}, song = np.song || {}, live = d.live || {}, st = d.station || {};
        if (st.listen_url) streamUrl = st.listen_url;

        els.title.textContent = song.title || song.text || st.name || "Radio";
        var artist = song.artist || "";
        if (artist && song.title && artist !== song.title) {
          els.artist.textContent = artist;
        } else {
          els.artist.textContent = "";
        }
        if (song.art && els.art.src !== song.art) els.art.src = song.art;

        var isLive = !!live.is_live;
        var online = d.is_online !== false;
        rb.classList.toggle("live", online);
        els.status.textContent = isLive
          ? (live.streamer_name ? "live · " + live.streamer_name : "live")
          : (online ? "on air" : "offline");

        var cur = d.listeners && typeof d.listeners.current === "number" ? d.listeners.current : null;
        els.listeners.textContent = cur != null ? "· " + cur + " listening" : "";

        if (song.id) currentSongId = song.id;
        updateLikeUi(currentSongId, !!np.is_request);
        notifyParent(cur, likeCount(currentSongId), !!np.is_request);

        duration = np.duration || 0;
        elapsed = np.elapsed || 0;
        lastSync = Date.now();
        tick();
      } catch (e) {
        if (!els.art.src) els.status.textContent = "offline";
      }
    }

    function tick() {
      if (duration > 0) {
        var e = elapsed + (Date.now() - lastSync) / 1000;
        var pct = Math.min(100, (e / duration) * 100);
        els.fill.style.width = pct + "%";
        els.bar.classList.remove("hidden");
      } else {
        els.bar.classList.add("hidden");
      }
    }

    function play() {
      rb.classList.add("loading");
      els.audio.src = streamUrl + (streamUrl.indexOf("?") < 0 ? "?" : "&") + "_=" + Date.now();
      var p = els.audio.play();
      if (p && p.catch) p.catch(function () { stop(); });
    }
    function stop() {
      els.audio.pause();
      els.audio.removeAttribute("src");
      els.audio.load();
      rb.classList.remove("playing", "loading");
    }

    els.play.addEventListener("click", function () {
      if (rb.classList.contains("playing") || rb.classList.contains("loading")) stop();
      else play();
    });

    els.like.addEventListener("click", function () {
      if (!currentSongId || els.like.disabled) return;
      var count = bumpLike(currentSongId);
      els.like.classList.add("liked");
      els.likes.textContent = String(count);
      notifyParent(null, count, false);
    });

    els.audio.addEventListener("playing", function () {
      rb.classList.remove("loading");
      rb.classList.add("playing");
    });
    els.audio.addEventListener("pause", function () { rb.classList.remove("playing", "loading"); });
    els.audio.addEventListener("error", function () { stop(); });

    poll();
    setInterval(poll, 15000);
    setInterval(tick, 1000);
  })();
  </script>
</body>
</html>
